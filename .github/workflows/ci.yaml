name: ci-wf
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Step
        run: echo "Welcome TO the Linting Job"
      - name: Clone Repo
        uses: actions/checkout@v6
      - name: Install Development Dependencies
        run: npm install
      - name: Lint HTML and CSS Files
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
  build-job:
    runs-on: ubuntu-latest
    needs: "lint-job"
    steps:
      - name: Weclome to Build Job
        run: echo "Weclome to Build Job"
      - name: Clone Repo
        uses: actions/checkout@v6
      - name: Install Dev-Dep
        run: npm install
      - name: Build Website with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./" --no-cache

